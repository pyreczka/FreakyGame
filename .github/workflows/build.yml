name: Build and test

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ qt6-base-dev
      - name: Configure
        run: cmake -S pliki -B pliki/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build pliki/build --parallel
      - name: Test
        run: ctest --test-dir pliki/build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64
      - name: Configure
        run: cmake -S pliki -B pliki/build -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
      - name: Build
        run: cmake --build pliki/build --config Release --parallel
      - name: Test
        run: ctest --test-dir pliki/build -C Release --output-on-failure
